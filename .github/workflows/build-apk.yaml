name: Build Spicy Kingdom Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-twa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore \
            -alias spicykingdom -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass spicy1234 -keypass spicy1234 \
            -dname "CN=Spicy Kingdom, OU=POS, O=Spicy Kingdom, L=Madanapalle, S=AP, C=IN"

      - name: Configure Bubblewrap Paths
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      - name: Build Signed Android APK & AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: spicy1234
          BUBBLEWRAP_KEY_PASSWORD: spicy1234
        run: |
          yes | bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation

      - name: Extract SHA-256 Fingerprint for Digital Asset Links
        run: |
          keytool -list -v -keystore android.keystore -alias spicykingdom -storepass spicy1234 | grep "SHA256:"

      - name: Upload APK & Keystore Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spicy-kingdom-android-release
          path: |
            app-release-signed.apk
            app-release-bundle.aab
            android.keystore
