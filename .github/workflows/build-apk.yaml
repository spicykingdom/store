name: Build Spicy Kingdom POS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare App Icon & Build Live-URL APK
        run: |
          mkdir -p www assets
          echo "<html><body>Loading Spicy Kingdom POS...</body></html>" > www/index.html

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/assets sharp

          curl -L -s "https://spicykingdom.store/icon-512.png" -o raw_logo.png
          node -e '
            const sharp = require("sharp");
            sharp("raw_logo.png")
              .resize(1024, 1024, { fit: "cover" })
              .png()
              .toFile("assets/icon-only.png")
              .then(() => require("fs").copyFileSync("assets/icon-only.png", "assets/icon.png"));
          '

          npx cap init "Spicy Kingdom POS" "store.spicykingdom.pos" --web-dir www

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "store.spicykingdom.pos",
            "appName": "Spicy Kingdom POS",
            "webDir": "www",
            "server": {
              "url": "https://spicykingdom.store/",
              "cleartext": true,
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#E11D48'

          # Add Google Maven Central mirror to bypass Maven Central 429 rate-limits
          sed -i 's|mavenCentral()|maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }\n        mavenCentral()|g' android/build.gradle

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>/' "$MANIFEST"

          MAIN_ACT=$(find android/app/src/main/java -name "MainActivity.java")
          if [ -n "$MAIN_ACT" ]; then
            sed -i 's/super.onCreate(savedInstanceState);/super.onCreate(savedInstanceState); getWindow().setStatusBarColor(android.graphics.Color.parseColor("#E11D48"));/' "$MAIN_ACT"
          fi

          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Spicy Kingdom POS APK
        uses: actions/upload-artifact@v4
        with:
          name: Spicy-Kingdom-POS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
